name: Build Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses:       - uses: android-actions/setup-android@v3
              with:
                        packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973'
        run: sdkmanager "ndk;27.0.12077973" "platforms;android-35" "build-tools;35.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "src-tauri" }
      - run: npm install
      - run: npm run vendor
      - run: npx tauri icon app-icon.png
      - run: npx tauri android init
      - name: Build debug APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: npx tauri android build --debug --apk
      - uses: actions/upload-artifact@v4
        with:
          name: watermark-offline-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
